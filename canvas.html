<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw with Custom Brush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .canvas-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .canvas-title {
            font-size: 24px;
            color: #000;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .canvas-info {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .info-item {
            background: #f5f5f5;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
        }

        .info-item strong {
            color: #000;
            font-weight: 500;
        }

        /* Drawing Tools */
        .tools-container {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .tools-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tool-label {
            font-size: 13px;
            font-weight: 500;
            color: #000;
        }

        /* Tool Buttons */
        .tool-buttons {
            display: flex;
            gap: 8px;
        }

        .tool-btn {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            border-color: #000;
        }

        .tool-btn.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        /* Color Palette */
        .color-palette {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.active {
            border-color: #000;
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #000;
        }

        /* Size Slider */
        .size-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .size-slider {
            width: 120px;
            height: 4px;
            border-radius: 2px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }

        .size-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #000;
            cursor: pointer;
        }

        .size-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #000;
            cursor: pointer;
            border: none;
        }

        .size-value {
            font-size: 13px;
            color: #666;
            min-width: 30px;
        }

        /* Canvas */
        #paintCanvas {
            display: block;
            margin: 0 auto;
            border: 1px solid #e0e0e0;
            cursor: crosshair;
            touch-action: none;
            max-width: 100%;
        }

        /* Canvas shape clip paths */
        #paintCanvas.shape-square {
            clip-path: none;
        }

        #paintCanvas.shape-circle {
            clip-path: circle(50%);
        }

        #paintCanvas.shape-star {
            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 57%,
                79% 91%,
                50% 70%,
                21% 91%,
                32% 57%,
                2% 35%,
                39% 35%
            );
        }

        #paintCanvas.shape-heart {
            clip-path: path('M 250,100 C 200,50 100,50 100,150 C 100,250 250,350 250,350 C 250,350 400,250 400,150 C 400,50 300,50 250,100');
            width: 500px;
            height: 450px;
        }

        /* Action Buttons */
        .canvas-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .btn:hover {
            border-color: #000;
        }

        .btn-primary {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .btn-primary:hover {
            background: #333;
        }

        @media (max-width: 600px) {
            .container {
                padding: 0;
            }

            .tools-row {
                flex-direction: column;
                align-items: flex-start;
            }

            #paintCanvas {
                width: 100% !important;
                height: auto !important;
            }

            .canvas-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-header">
            <h2 class="canvas-title">Start creating your masterpiece</h2>
            <div class="canvas-info">
                <div class="info-item">
                    <strong>Canvas:</strong> <span id="infoCanvas">-</span>
                </div>
                <div class="info-item">
                    <strong>Paper:</strong> <span id="infoPaper">-</span>
                </div>
            </div>
        </div>

        <!-- Drawing Tools -->
        <div class="tools-container">
            <div class="tools-row">
                <!-- Tool Selection -->
                <div class="tool-group">
                    <span class="tool-label">Tool:</span>
                    <div class="tool-buttons">
                        <button class="tool-btn active" id="btnBrush">Brush</button>
                        <button class="tool-btn" id="btnEraser">Eraser</button>
                    </div>
                </div>

                <!-- Color Palette -->
                <div class="tool-group">
                    <span class="tool-label">Color:</span>
                    <div class="color-palette">
                        <div class="color-swatch active" data-color="#000000" style="background: #000000;"></div>
                        <div class="color-swatch" data-color="#FF6B35" style="background: #FF6B35;"></div>
                        <div class="color-swatch" data-color="#0077BE" style="background: #0077BE;"></div>
                        <div class="color-swatch" data-color="#6BBF59" style="background: #6BBF59;"></div>
                        <div class="color-swatch" data-color="#FFD700" style="background: #FFD700;"></div>
                        <div class="color-swatch" data-color="#9B59B6" style="background: #9B59B6;"></div>
                        <div class="color-swatch" data-color="#E74C3C" style="background: #E74C3C;"></div>
                        <div class="color-swatch" data-color="#8B4513" style="background: #8B4513;"></div>
                    </div>
                </div>

                <!-- Size Control -->
                <div class="tool-group">
                    <span class="tool-label">Size:</span>
                    <div class="size-control">
                        <input type="range" class="size-slider" id="sizeSlider" min="1" max="50" value="20">
                        <span class="size-value" id="sizeValue">20</span>
                    </div>
                </div>
            </div>
        </div>

        <canvas id="paintCanvas" width="500" height="500"></canvas>

        <div class="canvas-controls">
            <button class="btn" id="btnClear">Clear Canvas</button>
            <button class="btn" id="btnSave">Save Drawing</button>
            <button class="btn" id="btnRestart">Restart</button>
            <button class="btn btn-primary" id="btnChange">Change Settings</button>
        </div>
    </div>

    <script>
        // ============================================
        // LOAD SETTINGS FROM LOCALSTORAGE
        // ============================================
        const settings = JSON.parse(localStorage.getItem('brushSettings'));

        // Redirect to step 1 if settings are incomplete
        if (!settings || !settings.canvasShape || !settings.paperColor) {
            window.location.href = 'step1.html';
        }

        // Display canvas information
        document.getElementById('infoCanvas').textContent = settings.canvasShapeName;
        document.getElementById('infoPaper').textContent = settings.paperName;

        // ============================================
        // CANVAS SETUP
        // ============================================
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');

        // Apply canvas shape clip-path
        canvas.classList.add('shape-' + settings.canvasShape);

        // Set canvas background to paper color
        canvas.style.background = settings.paperColor;

        // ============================================
        // DRAWING STATE
        // ============================================
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentTool = 'brush'; // 'brush' or 'eraser'
        let currentColor = '#000000';
        let brushSize = 20;

        // ============================================
        // TOOL CONTROLS
        // ============================================
        // Tool selection
        document.getElementById('btnBrush').addEventListener('click', function() {
            currentTool = 'brush';
            this.classList.add('active');
            document.getElementById('btnEraser').classList.remove('active');
            canvas.style.cursor = 'crosshair';
        });

        document.getElementById('btnEraser').addEventListener('click', function() {
            currentTool = 'eraser';
            this.classList.add('active');
            document.getElementById('btnBrush').classList.remove('active');
            canvas.style.cursor = 'default';
        });

        // Color selection
        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.addEventListener('click', function() {
                currentColor = this.dataset.color;
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Size slider
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');

        sizeSlider.addEventListener('input', function() {
            brushSize = parseInt(this.value);
            sizeValue.textContent = brushSize;
        });

        // ============================================
        // DRAWING EVENT LISTENERS
        // ============================================
        // Mouse events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch events
        canvas.addEventListener('touchstart', handleTouchStart);
        canvas.addEventListener('touchmove', handleTouchMove);
        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        }

        function handleTouchStart(e) {
            e.preventDefault();
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            drawLine(x, y);
            lastX = x;
            lastY = y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function draw(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            drawLine(x, y);

            lastX = x;
            lastY = y;
        }

        function drawLine(x, y) {
            // Calculate distance for smooth interpolation
            const distance = Math.sqrt((x - lastX) ** 2 + (y - lastY) ** 2);
            const steps = Math.max(1, Math.floor(distance / 2));

            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const interpX = lastX + (x - lastX) * t;
                const interpY = lastY + (y - lastY) * t;

                if (currentTool === 'brush') {
                    drawBrush(interpX, interpY);
                } else {
                    drawEraser(interpX, interpY);
                }
            }
        }

        function drawBrush(x, y) {
            ctx.fillStyle = currentColor;
            ctx.globalCompositeOperation = 'source-over';
            ctx.beginPath();
            ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawEraser(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
        }

        // ============================================
        // ACTION BUTTONS
        // ============================================
        document.getElementById('btnClear').addEventListener('click', () => {
            if (confirm('Clear the entire canvas?')) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        document.getElementById('btnSave').addEventListener('click', () => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            // Fill with paper color
            tempCtx.fillStyle = settings.paperColor;
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

            // Draw the actual canvas content
            tempCtx.drawImage(canvas, 0, 0);

            // Download
            tempCanvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
                link.download = `my-painting-${timestamp}.png`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            });
        });

        document.getElementById('btnRestart').addEventListener('click', () => {
            if (confirm('This will clear your current drawing and start over. Are you sure?')) {
                localStorage.removeItem('brushSettings');
                window.location.href = 'step1.html';
            }
        });

        document.getElementById('btnChange').addEventListener('click', () => {
            window.location.href = 'step1.html';
        });
    </script>
</body>
</html>

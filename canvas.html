<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw with Custom Brush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .canvas-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .canvas-title {
            font-size: 24px;
            color: #000;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .brush-info {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .brush-info-item {
            background: #f5f5f5;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
        }

        .brush-info-item strong {
            color: #000;
            font-weight: 500;
        }

        #paintCanvas {
            display: block;
            margin: 0 auto;
            border: 1px solid #e0e0e0;
            cursor: crosshair;
            touch-action: none;
            max-width: 100%;
        }

        /* Canvas shape clip paths */
        #paintCanvas.shape-square {
            clip-path: none;
        }

        #paintCanvas.shape-circle {
            clip-path: circle(50%);
        }

        #paintCanvas.shape-star {
            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 57%,
                79% 91%,
                50% 70%,
                21% 91%,
                32% 57%,
                2% 35%,
                39% 35%
            );
        }

        #paintCanvas.shape-heart {
            clip-path: path('M 250,100 C 200,50 100,50 100,150 C 100,250 250,350 250,350 C 250,350 400,250 400,150 C 400,50 300,50 250,100');
            width: 500px;
            height: 450px;
        }

        .canvas-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .btn-reset {
            color: #000;
        }

        .btn-reset:hover {
            border-color: #000;
        }

        .btn-save {
            color: #000;
        }

        .btn-save:hover {
            border-color: #000;
        }

        .btn-restart {
            color: #000;
        }

        .btn-restart:hover {
            border-color: #000;
        }

        .btn-change {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .btn-change:hover {
            background: #333;
        }

        @media (max-width: 600px) {
            .container {
                padding: 0;
            }

            #paintCanvas {
                width: 100% !important;
                height: auto !important;
            }

            .canvas-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-header">
            <h2 class="canvas-title">Start creating your masterpiece</h2>
            <div class="brush-info">
                <div class="brush-info-item">
                    <strong>Canvas:</strong> <span id="infoCanvas">-</span>
                </div>
                <div class="brush-info-item">
                    <strong>Brush Color:</strong> <span id="infoColor">-</span>
                </div>
                <div class="brush-info-item">
                    <strong>Brush Shape:</strong> <span id="infoShape">-</span>
                </div>
                <div class="brush-info-item">
                    <strong>Paper Color:</strong> <span id="infoPaper">-</span>
                </div>
            </div>
        </div>

        <canvas id="paintCanvas" width="500" height="500"></canvas>

        <div class="canvas-controls">
            <button class="btn btn-reset" id="btnReset">Clear Canvas</button>
            <button class="btn btn-save" id="btnSave">Save Drawing</button>
            <button class="btn btn-restart" id="btnRestart">Restart</button>
            <button class="btn btn-change" id="btnChange">Change Brush</button>
        </div>
    </div>

    <script>
        // ============================================
        // LOAD BRUSH SETTINGS FROM LOCALSTORAGE
        // ============================================
        const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));

        // Redirect to step 1 if brush settings are incomplete
        if (!brushSettings || !brushSettings.canvasShape || !brushSettings.color || !brushSettings.shape || !brushSettings.paperColor) {
            window.location.href = 'step1.html';
        }

        // Display brush information
        document.getElementById('infoCanvas').textContent = brushSettings.canvasShapeName;
        document.getElementById('infoColor').textContent = brushSettings.colorName;
        document.getElementById('infoShape').textContent =
            brushSettings.shape.charAt(0).toUpperCase() + brushSettings.shape.slice(1);
        document.getElementById('infoPaper').textContent = brushSettings.paperName;

        // ============================================
        // CANVAS DRAWING IMPLEMENTATION
        // ============================================
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');

        // Apply canvas shape clip-path
        canvas.classList.add('shape-' + brushSettings.canvasShape);

        // Set canvas background to paper color
        canvas.style.background = brushSettings.paperColor;

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Brush size configuration
        const brushSize = 20;

        // ============================================
        // EVENT LISTENERS
        // ============================================
        // Mouse events
        canvas.addEventListener('mousedown', startDrawingEvent);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch events for mobile devices
        canvas.addEventListener('touchstart', handleTouchStart);
        canvas.addEventListener('touchmove', handleTouchMove);
        canvas.addEventListener('touchend', stopDrawing);

        /**
         * Starts drawing when mouse button is pressed
         */
        function startDrawingEvent(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        }

        /**
         * Handles touch start event
         */
        function handleTouchStart(e) {
            e.preventDefault();
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
        }

        /**
         * Handles touch move event
         */
        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            drawBrushStroke(x, y);
            lastX = x;
            lastY = y;
        }

        /**
         * Stops drawing when mouse button is released
         */
        function stopDrawing() {
            isDrawing = false;
        }

        /**
         * Main drawing function called on mouse/touch move
         */
        function draw(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            drawBrushStroke(x, y);

            lastX = x;
            lastY = y;
        }

        /**
         * Draws a brush stroke from last position to current position
         * Applies the custom brush settings (color and shape)
         */
        function drawBrushStroke(x, y) {
            // Calculate distance for interpolation (to create smooth lines)
            const distance = Math.sqrt((x - lastX) ** 2 + (y - lastY) ** 2);
            const steps = Math.max(1, Math.floor(distance / 5));

            // Draw interpolated stamps along the path
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const interpX = lastX + (x - lastX) * t;
                const interpY = lastY + (y - lastY) * t;

                drawStamp(interpX, interpY);
            }
        }

        /**
         * Draw a brush stamp at the given position
         */
        function drawStamp(x, y) {
            ctx.fillStyle = brushSettings.color;
            ctx.globalAlpha = 0.8;
            drawShape(x, y, brushSize);
            ctx.globalAlpha = 1.0;
        }

        /**
         * Draws the actual shape based on brush shape setting
         * @param {number} x - X coordinate
         * @param {number} y - Y coordinate
         * @param {number} size - Size of the shape
         */
        function drawShape(x, y, size) {
            ctx.save();

            switch (brushSettings.shape) {
                case 'round':
                    // Draw a circle
                    ctx.beginPath();
                    ctx.arc(x, y, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'angular':
                    // Draw a triangle
                    ctx.beginPath();
                    ctx.moveTo(x, y - size / 2);
                    ctx.lineTo(x - size / 2, y + size / 2);
                    ctx.lineTo(x + size / 2, y + size / 2);
                    ctx.closePath();
                    ctx.fill();
                    break;

                case 'rectangle':
                    // Draw a rectangle
                    ctx.fillRect(x - size / 2, y - size / 2, size, size * 0.7);
                    break;
            }

            ctx.restore();
        }

        // ============================================
        // BUTTON HANDLERS
        // ============================================
        /**
         * Clear Canvas: Clear all drawings but keep the paper color
         */
        document.getElementById('btnReset').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        /**
         * Save Drawing: Download the canvas as PNG image
         */
        document.getElementById('btnSave').addEventListener('click', () => {
            // Create a temporary canvas to merge background color with drawing
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            // Fill with paper color
            tempCtx.fillStyle = brushSettings.paperColor;
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

            // Draw the actual canvas content on top
            tempCtx.drawImage(canvas, 0, 0);

            // Convert to blob and download
            tempCanvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
                link.download = `my-painting-${timestamp}.png`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            });
        });

        /**
         * Restart: Clear localStorage and return to step 1
         */
        document.getElementById('btnRestart').addEventListener('click', () => {
            if (confirm('This will clear your current drawing and start over. Are you sure?')) {
                localStorage.removeItem('brushSettings');
                window.location.href = 'step1.html';
            }
        });

        /**
         * Change Brush: Return to step 1 (keeping current settings)
         */
        document.getElementById('btnChange').addEventListener('click', () => {
            window.location.href = 'step1.html';
        });
    </script>
</body>
</html>

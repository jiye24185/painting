<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw with Custom Brush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .canvas-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .canvas-title {
            font-size: 24px;
            color: #000;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .brush-info {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .brush-info-item {
            background: #f5f5f5;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
        }

        .brush-info-item strong {
            color: #000;
            font-weight: 500;
        }

        #paintCanvas {
            display: block;
            margin: 0 auto;
            border: 1px solid #e0e0e0;
            cursor: crosshair;
            touch-action: none;
            background: white;
            max-width: 100%;
        }

        .canvas-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .btn-reset {
            color: #000;
        }

        .btn-reset:hover {
            border-color: #000;
        }

        .btn-change {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .btn-change:hover {
            background: #333;
        }

        @media (max-width: 600px) {
            .container {
                padding: 0;
            }

            #paintCanvas {
                width: 100% !important;
                height: auto !important;
            }

            .canvas-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-header">
            <h2 class="canvas-title">Start creating your masterpiece</h2>
            <div class="brush-info">
                <div class="brush-info-item">
                    <strong>Color:</strong> <span id="infoColor">-</span>
                </div>
                <div class="brush-info-item">
                    <strong>Shape:</strong> <span id="infoShape">-</span>
                </div>
                <div class="brush-info-item">
                    <strong>Texture:</strong> <span id="infoTexture">-</span>
                </div>
            </div>
        </div>

        <canvas id="paintCanvas" width="740" height="500"></canvas>

        <div class="canvas-controls">
            <button class="btn btn-reset" id="btnReset">Clear Canvas</button>
            <button class="btn btn-change" id="btnChange">Change Brush</button>
        </div>
    </div>

    <script>
        // ============================================
        // LOAD BRUSH SETTINGS FROM LOCALSTORAGE
        // ============================================
        const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));

        // Redirect to step 1 if brush settings are incomplete
        if (!brushSettings || !brushSettings.color || !brushSettings.shape || !brushSettings.texture) {
            window.location.href = 'step1.html';
        }

        // Display brush information
        document.getElementById('infoColor').textContent = brushSettings.colorName;
        document.getElementById('infoShape').textContent =
            brushSettings.shape.charAt(0).toUpperCase() + brushSettings.shape.slice(1);
        document.getElementById('infoTexture').textContent =
            brushSettings.texture.charAt(0).toUpperCase() + brushSettings.texture.slice(1);

        // ============================================
        // CANVAS DRAWING IMPLEMENTATION
        // ============================================
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Brush size configuration
        const brushSize = 20;

        // ============================================
        // EVENT LISTENERS
        // ============================================
        // Mouse events
        canvas.addEventListener('mousedown', startDrawingEvent);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch events for mobile devices
        canvas.addEventListener('touchstart', handleTouchStart);
        canvas.addEventListener('touchmove', handleTouchMove);
        canvas.addEventListener('touchend', stopDrawing);

        /**
         * Starts drawing when mouse button is pressed
         */
        function startDrawingEvent(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        }

        /**
         * Handles touch start event
         */
        function handleTouchStart(e) {
            e.preventDefault();
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
        }

        /**
         * Handles touch move event
         */
        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            drawBrushStroke(x, y);
            lastX = x;
            lastY = y;
        }

        /**
         * Stops drawing when mouse button is released
         */
        function stopDrawing() {
            isDrawing = false;
        }

        /**
         * Main drawing function called on mouse/touch move
         */
        function draw(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            drawBrushStroke(x, y);

            lastX = x;
            lastY = y;
        }

        /**
         * Draws a brush stroke from last position to current position
         * Applies the custom brush settings (color, shape, texture)
         */
        function drawBrushStroke(x, y) {
            // Calculate distance for interpolation (to create smooth lines)
            const distance = Math.sqrt((x - lastX) ** 2 + (y - lastY) ** 2);
            const steps = Math.max(1, Math.floor(distance / 5));

            // Draw interpolated stamps along the path
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const interpX = lastX + (x - lastX) * t;
                const interpY = lastY + (y - lastY) * t;

                // Apply texture-specific rendering
                switch (brushSettings.texture) {
                    case 'smooth':
                        drawSmoothStamp(interpX, interpY);
                        break;
                    case 'rough':
                        drawRoughStamp(interpX, interpY);
                        break;
                    case 'dotted':
                        // Only draw dots at intervals for dotted texture
                        if (i % 3 === 0) {
                            drawDottedStamp(interpX, interpY);
                        }
                        break;
                }
            }
        }

        /**
         * SMOOTH TEXTURE: Normal brush with full opacity
         */
        function drawSmoothStamp(x, y) {
            ctx.fillStyle = brushSettings.color;
            ctx.globalAlpha = 0.8;
            drawShape(x, y, brushSize);
            ctx.globalAlpha = 1.0;
        }

        /**
         * ROUGH TEXTURE: Varied opacity and jittered position for rough appearance
         */
        function drawRoughStamp(x, y) {
            // Random opacity variation
            ctx.globalAlpha = 0.3 + Math.random() * 0.4;
            ctx.fillStyle = brushSettings.color;

            // Draw multiple stamps with slight position jitter
            for (let i = 0; i < 3; i++) {
                const jitterX = x + (Math.random() - 0.5) * brushSize * 0.5;
                const jitterY = y + (Math.random() - 0.5) * brushSize * 0.5;
                const jitterSize = brushSize * (0.7 + Math.random() * 0.3);
                drawShape(jitterX, jitterY, jitterSize);
            }

            ctx.globalAlpha = 1.0;
        }

        /**
         * DOTTED TEXTURE: Spaced dots along the stroke path
         */
        function drawDottedStamp(x, y) {
            ctx.fillStyle = brushSettings.color;
            ctx.globalAlpha = 0.9;
            drawShape(x, y, brushSize * 0.8);
            ctx.globalAlpha = 1.0;
        }

        /**
         * Draws the actual shape based on brush shape setting
         * @param {number} x - X coordinate
         * @param {number} y - Y coordinate
         * @param {number} size - Size of the shape
         */
        function drawShape(x, y, size) {
            ctx.save();

            switch (brushSettings.shape) {
                case 'round':
                    // Draw a circle
                    ctx.beginPath();
                    ctx.arc(x, y, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'angular':
                    // Draw a triangle
                    ctx.beginPath();
                    ctx.moveTo(x, y - size / 2);
                    ctx.lineTo(x - size / 2, y + size / 2);
                    ctx.lineTo(x + size / 2, y + size / 2);
                    ctx.closePath();
                    ctx.fill();
                    break;

                case 'rectangle':
                    // Draw a rectangle
                    ctx.fillRect(x - size / 2, y - size / 2, size, size * 0.7);
                    break;
            }

            ctx.restore();
        }

        // ============================================
        // BUTTON HANDLERS
        // ============================================
        /**
         * Reset Board: Clear the entire canvas
         */
        document.getElementById('btnReset').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        /**
         * Change My Brush: Return to step 1
         */
        document.getElementById('btnChange').addEventListener('click', () => {
            window.location.href = 'step1.html';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Brush Painter - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome-container {
            text-align: center;
            max-width: 600px;
            padding: 60px 40px;
        }

        h1 {
            font-size: 32px;
            color: #000;
            margin-bottom: 16px;
            font-weight: 600;
        }

        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
        }

        .btn-start {
            padding: 12px 32px;
            background: #000;
            color: #fff;
            border: 1px solid #000;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-start:hover {
            background: #333;
        }

        .features {
            margin-top: 60px;
            text-align: left;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 24px;
        }

        .features h2 {
            font-size: 16px;
            color: #000;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .features ul {
            list-style: none;
            padding: 0;
        }

        .features li {
            padding: 6px 0;
            color: #666;
            font-size: 14px;
        }

        .features li::before {
            content: '• ';
            margin-right: 8px;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1>Custom Brush Painter</h1>
        <p>Create your own unique brush and start painting</p>
        <a href="step1.html" class="btn-start">Get Started</a>

        <div class="features">
            <h2>How it works</h2>
            <ul>
                <li>Step 1: Choose your canvas shape</li>
                <li>Step 2: Choose your paper texture</li>
                <li>Draw with color palette, brush, and eraser tools</li>
                <li>Save your masterpiece</li>
            </ul>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Brush Painter - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome-container {
            text-align: center;
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }

        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }

        .btn-start {
            padding: 15px 40px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-start:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .features {
            margin-top: 40px;
            text-align: left;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

        .features h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 15px;
        }

        .features ul {
            list-style: none;
            padding: 0;
        }

        .features li {
            padding: 8px 0;
            color: #666;
            font-size: 16px;
        }

        .features li::before {
            content: '✨ ';
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1>Custom Brush Painter</h1>
        <p>Create your own unique brush and start painting!</p>
        <a href="step1.html" class="btn-start">Get Started</a>

        <div class="features">
            <h2>How it works:</h2>
            <ul>
                <li>Step 1: Choose your brush color</li>
                <li>Step 2: Select your brush shape</li>
                <li>Step 3: Pick your brush texture</li>
                <li>Draw your masterpiece on the canvas!</li>
            </ul>
        </div>
    </div>

    <script>
        // Auto-redirect to step1.html after 2 seconds (optional)
        // Uncomment the line below if you want automatic redirection
        // setTimeout(() => { window.location.href = 'step1.html'; }, 2000);
    </script>
</body>
</html>

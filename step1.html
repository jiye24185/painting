<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1: Choose Color</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .step-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e0e0e0;
        }

        .step-dot.active {
            background: #000;
        }

        .step-title {
            font-size: 24px;
            color: #000;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .step-description {
            color: #666;
            font-size: 14px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 0 0 40px 0;
        }

        .option-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .option-card:hover {
            border-color: #000;
        }

        .option-card.selected {
            border-color: #000;
            border-width: 2px;
            padding: 23px 15px;
        }

        .color-swatch {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 16px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .option-label {
            font-size: 14px;
            font-weight: 500;
            color: #000;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .step-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="step-header">
            <div class="step-indicator">
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
                <div class="step-dot"></div>
            </div>
            <h1 class="step-title">Choose your brush color</h1>
            <p class="step-description">Select a color for your custom brush</p>
        </div>

        <div class="options-grid">
            <div class="option-card" data-color="#FF6B35" data-name="Sunset Orange">
                <div class="color-swatch" style="background: #FF6B35;"></div>
                <div class="option-label">Sunset Orange</div>
            </div>
            <div class="option-card" data-color="#0077BE" data-name="Ocean Blue">
                <div class="color-swatch" style="background: #0077BE;"></div>
                <div class="option-label">Ocean Blue</div>
            </div>
            <div class="option-card" data-color="#6BBF59" data-name="Leaf Green">
                <div class="color-swatch" style="background: #6BBF59;"></div>
                <div class="option-label">Leaf Green</div>
            </div>
        </div>
    </div>

    <script>
        // Initialize localStorage for brush settings if not exists
        if (!localStorage.getItem('brushSettings')) {
            localStorage.setItem('brushSettings', JSON.stringify({
                color: null,
                colorName: null,
                shape: null,
                paperColor: null,
                paperName: null
            }));
        }

        // Handle option card clicks
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', function() {
                const color = this.dataset.color;
                const colorName = this.dataset.name;

                // Remove selected class from all cards
                document.querySelectorAll('.option-card').forEach(c => {
                    c.classList.remove('selected');
                });

                // Add selected class to clicked card
                this.classList.add('selected');

                // Store color selection in localStorage
                const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
                brushSettings.color = color;
                brushSettings.colorName = colorName;
                localStorage.setItem('brushSettings', JSON.stringify(brushSettings));

                // Navigate to step 2 after a brief delay
                setTimeout(() => {
                    window.location.href = 'step2.html';
                }, 300);
            });
        });

        // Restore previous selection if coming back from step 2
        const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
        if (brushSettings.color) {
            document.querySelectorAll('.option-card').forEach(card => {
                if (card.dataset.color === brushSettings.color) {
                    card.classList.add('selected');
                }
            });
        }
    </script>
</body>
</html>

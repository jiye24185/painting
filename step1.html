<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1: Choose Canvas Shape</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .step-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e0e0e0;
        }

        .step-dot.active {
            background: #000;
        }

        .step-title {
            font-size: 24px;
            color: #000;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .step-description {
            color: #666;
            font-size: 14px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 0 0 40px 0;
        }

        .option-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .option-card:hover {
            border-color: #000;
        }

        .option-card.selected {
            border-color: #000;
            border-width: 2px;
            padding: 39px 19px;
        }

        .shape-preview {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-square {
            width: 70px;
            height: 70px;
            background: #000;
        }

        .canvas-star {
            width: 70px;
            height: 70px;
            background: #000;
            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 57%,
                79% 91%,
                50% 70%,
                21% 91%,
                32% 57%,
                2% 35%,
                39% 35%
            );
        }

        .canvas-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #000;
        }

        .canvas-heart {
            position: relative;
            width: 70px;
            height: 70px;
        }

        .canvas-heart::before,
        .canvas-heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 35px;
            height: 56px;
            background: #000;
            border-radius: 35px 35px 0 0;
        }

        .canvas-heart::before {
            left: 35px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .canvas-heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        .option-label {
            font-size: 14px;
            font-weight: 500;
            color: #000;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .step-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="step-header">
            <div class="step-indicator">
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
            </div>
            <h1 class="step-title">Choose your canvas shape</h1>
            <p class="step-description">Select the shape of your drawing canvas</p>
        </div>

        <div class="options-grid">
            <div class="option-card" data-shape="square" data-name="Square">
                <div class="shape-preview">
                    <div class="canvas-square"></div>
                </div>
                <div class="option-label">Square</div>
            </div>
            <div class="option-card" data-shape="star" data-name="Star">
                <div class="shape-preview">
                    <div class="canvas-star"></div>
                </div>
                <div class="option-label">Star</div>
            </div>
            <div class="option-card" data-shape="circle" data-name="Circle">
                <div class="shape-preview">
                    <div class="canvas-circle"></div>
                </div>
                <div class="option-label">Circle</div>
            </div>
            <div class="option-card" data-shape="heart" data-name="Heart">
                <div class="shape-preview">
                    <div class="canvas-heart"></div>
                </div>
                <div class="option-label">Heart</div>
            </div>
        </div>
    </div>

    <script>
        // Initialize localStorage for brush settings if not exists
        if (!localStorage.getItem('brushSettings')) {
            localStorage.setItem('brushSettings', JSON.stringify({
                canvasShape: null,
                canvasShapeName: null,
                paperTexture: null,
                paperTextureName: null
            }));
        }

        // Handle option card clicks
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', function() {
                const canvasShape = this.dataset.shape;
                const canvasShapeName = this.dataset.name;

                // Remove selected class from all cards
                document.querySelectorAll('.option-card').forEach(c => {
                    c.classList.remove('selected');
                });

                // Add selected class to clicked card
                this.classList.add('selected');

                // Store canvas shape selection in localStorage
                const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
                brushSettings.canvasShape = canvasShape;
                brushSettings.canvasShapeName = canvasShapeName;
                localStorage.setItem('brushSettings', JSON.stringify(brushSettings));

                // Navigate to step 2 after a brief delay
                setTimeout(() => {
                    window.location.href = 'step2.html';
                }, 300);
            });
        });

        // Restore previous selection if coming back from step 2
        const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
        if (brushSettings && brushSettings.canvasShape) {
            document.querySelectorAll('.option-card').forEach(card => {
                if (card.dataset.shape === brushSettings.canvasShape) {
                    card.classList.add('selected');
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Choose Paper Texture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .page-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back-arrow {
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s ease;
            margin-right: 16px;
        }

        .btn-back-arrow:hover {
            border-color: #000;
        }

        .step-header {
            text-align: center;
            flex: 1;
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e0e0e0;
        }

        .step-dot.active {
            background: #000;
        }

        .step-title {
            font-size: 24px;
            color: #000;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .step-description {
            color: #666;
            font-size: 14px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 0 0 40px 0;
        }

        .option-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .option-card:hover {
            border-color: #000;
        }

        .option-card.selected {
            border-color: #000;
            border-width: 2px;
            padding: 15px;
        }

        .texture-preview {
            width: 150px;
            height: 150px;
            margin: 0 auto 12px auto;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .texture-preview.shape-square {
            width: 150px;
            height: 150px;
        }

        .texture-preview.shape-circle {
            width: 150px;
            height: 150px;
        }

        .texture-preview.shape-star {
            width: 150px;
            height: 150px;
        }

        .texture-preview.shape-heart {
            width: 150px;
            height: 150px;
        }

        .texture-tan {
            background: linear-gradient(135deg, #D4A574 0%, #C89968 50%, #B8865F 100%);
        }

        .texture-white {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8F8F8 50%, #F0F0F0 100%);
        }

        .texture-grid {
            background:
                linear-gradient(0deg, transparent 24%, rgba(0, 0, 0, .05) 25%, rgba(0, 0, 0, .05) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, .05) 75%, rgba(0, 0, 0, .05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 0, 0, .05) 25%, rgba(0, 0, 0, .05) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, .05) 75%, rgba(0, 0, 0, .05) 76%, transparent 77%, transparent);
            background-size: 25px 25px;
            background-color: #F5F5F5;
        }

        /* Canvas shape clip paths for texture previews */
        .texture-preview.shape-square {
            clip-path: none;
        }

        .texture-preview.shape-circle {
            clip-path: circle(50%);
        }

        .texture-preview.shape-star {
            clip-path: polygon(
                50% 5%,
                61% 40%,
                98% 40%,
                68% 62%,
                79% 95%,
                50% 75%,
                21% 95%,
                32% 62%,
                2% 40%,
                39% 40%
            );
        }

        .texture-preview.shape-heart {
            clip-path: polygon(
                50% 85%,
                25% 63%,
                15% 48%,
                12% 35%,
                12% 28%,
                15% 22%,
                20% 17%,
                26% 14%,
                33% 13%,
                40% 15%,
                45% 19%,
                50% 25%,
                55% 19%,
                60% 15%,
                67% 13%,
                74% 14%,
                80% 17%,
                85% 22%,
                88% 28%,
                88% 35%,
                85% 48%,
                75% 63%
            );
        }

        .option-label {
            font-size: 14px;
            font-weight: 500;
            color: #000;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .step-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <button class="btn-back-arrow" id="btnBack">← Back</button>
            <div class="step-header">
                <div class="step-indicator">
                    <div class="step-dot"></div>
                    <div class="step-dot active"></div>
                </div>
                <h1 class="step-title">Choose your paper texture</h1>
                <p class="step-description">Select a background texture for your canvas</p>
            </div>
        </div>

        <div class="options-grid">
            <div class="option-card" data-texture="Texturelabs_Paper_150S.jpg" data-name="Tan Paper">
                <div class="texture-preview texture-tan"></div>
                <div class="option-label">Tan Paper</div>
            </div>
            <div class="option-card" data-texture="Texturelabs_Paper_237S.jpg" data-name="White Paper">
                <div class="texture-preview texture-white"></div>
                <div class="option-label">White Paper</div>
            </div>
            <div class="option-card" data-texture="Texturelabs_Paper_300S.jpg" data-name="Grid Paper">
                <div class="texture-preview texture-grid"></div>
                <div class="option-label">Grid Paper</div>
            </div>
        </div>
    </div>

    <script>
        // Check if user has selected canvas shape in step 1
        const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
        if (!brushSettings || !brushSettings.canvasShape) {
            // Redirect back to step 1 if no canvas shape selected
            window.location.href = 'step1.html';
        }

        // Apply the selected canvas shape to all texture previews
        const selectedShape = brushSettings.canvasShape;
        document.querySelectorAll('.texture-preview').forEach(preview => {
            preview.classList.add(`shape-${selectedShape}`);
        });

        // Handle option card clicks
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', function() {
                const texture = this.dataset.texture;
                const textureName = this.dataset.name;

                // Remove selected class from all cards
                document.querySelectorAll('.option-card').forEach(c => {
                    c.classList.remove('selected');
                });

                // Add selected class to clicked card
                this.classList.add('selected');

                // Store texture selection in localStorage
                const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
                brushSettings.paperTexture = texture;
                brushSettings.paperTextureName = textureName;
                localStorage.setItem('brushSettings', JSON.stringify(brushSettings));

                // Navigate to canvas after a brief delay
                setTimeout(() => {
                    window.location.href = 'canvas.html';
                }, 300);
            });
        });

        // Restore previous selection if coming back from canvas
        if (brushSettings.paperTexture) {
            document.querySelectorAll('.option-card').forEach(card => {
                if (card.dataset.texture === brushSettings.paperTexture) {
                    card.classList.add('selected');
                }
            });
        }

        // Back button handler
        document.getElementById('btnBack').addEventListener('click', () => {
            window.location.href = 'step1.html';
        });
    </script>
</body>
</html>

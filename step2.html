<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Choose Shape - Custom Brush Painter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .step-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
            transition: all 0.3s ease;
        }

        .step-dot.active {
            background: #667eea;
            width: 30px;
            border-radius: 6px;
        }

        .step-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .step-description {
            color: #666;
            font-size: 16px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .option-card {
            background: #f8f9fa;
            border: 3px solid transparent;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .option-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
            animation: pulse 0.4s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .option-card.selected::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            background: #667eea;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .shape-preview {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shape-angular {
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 70px solid #667eea;
        }

        .shape-round {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #667eea;
        }

        .shape-rectangle {
            width: 70px;
            height: 50px;
            background: #667eea;
            border-radius: 5px;
        }

        .option-label {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .step-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-back {
            background: #e0e0e0;
            color: #666;
        }

        .btn-back:hover {
            background: #d0d0d0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .options-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .step-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="step-header">
            <div class="step-indicator">
                <div class="step-dot"></div>
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
            </div>
            <h1 class="step-title">Choose your brush shape</h1>
            <p class="step-description">Pick a shape that defines your brush style</p>
        </div>

        <div class="options-grid">
            <div class="option-card" data-shape="angular">
                <div class="shape-preview">
                    <div class="shape-angular"></div>
                </div>
                <div class="option-label">Angular</div>
            </div>
            <div class="option-card" data-shape="round">
                <div class="shape-preview">
                    <div class="shape-round"></div>
                </div>
                <div class="option-label">Round</div>
            </div>
            <div class="option-card" data-shape="rectangle">
                <div class="shape-preview">
                    <div class="shape-rectangle"></div>
                </div>
                <div class="option-label">Rectangle</div>
            </div>
        </div>

        <div class="step-navigation">
            <button class="btn btn-back" id="btnBack">Back</button>
        </div>
    </div>

    <script>
        // Check if user has selected color in step 1
        const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
        if (!brushSettings || !brushSettings.color) {
            // Redirect back to step 1 if no color selected
            window.location.href = 'step1.html';
        }

        // Handle option card clicks
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', function() {
                const shape = this.dataset.shape;

                // Remove selected class from all cards
                document.querySelectorAll('.option-card').forEach(c => {
                    c.classList.remove('selected');
                });

                // Add selected class to clicked card
                this.classList.add('selected');

                // Store shape selection in localStorage
                const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
                brushSettings.shape = shape;
                localStorage.setItem('brushSettings', JSON.stringify(brushSettings));

                // Navigate to step 3 after a brief delay
                setTimeout(() => {
                    window.location.href = 'step3.html';
                }, 400);
            });
        });

        // Restore previous selection if coming back from step 3
        if (brushSettings.shape) {
            document.querySelectorAll('.option-card').forEach(card => {
                if (card.dataset.shape === brushSettings.shape) {
                    card.classList.add('selected');
                }
            });
        }

        // Back button handler
        document.getElementById('btnBack').addEventListener('click', () => {
            window.location.href = 'step1.html';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 3: Choose Texture - Custom Brush Painter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .step-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
            transition: all 0.3s ease;
        }

        .step-dot.active {
            background: #667eea;
            width: 30px;
            border-radius: 6px;
        }

        .step-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .step-description {
            color: #666;
            font-size: 16px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .option-card {
            background: #f8f9fa;
            border: 3px solid transparent;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .option-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
            animation: pulse 0.4s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .option-card.selected::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            background: #667eea;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .texture-preview {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .texture-smooth {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .texture-rough {
            background: repeating-linear-gradient(
                45deg,
                #667eea,
                #667eea 5px,
                #764ba2 5px,
                #764ba2 10px
            );
        }

        .texture-dotted {
            background: radial-gradient(circle, #667eea 2px, transparent 2px);
            background-size: 15px 15px;
            background-color: #764ba2;
        }

        .option-label {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .step-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-back {
            background: #e0e0e0;
            color: #666;
        }

        .btn-back:hover {
            background: #d0d0d0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .options-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .step-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="step-header">
            <div class="step-indicator">
                <div class="step-dot"></div>
                <div class="step-dot"></div>
                <div class="step-dot active"></div>
            </div>
            <h1 class="step-title">Choose your brush texture</h1>
            <p class="step-description">Select how your brush strokes will appear</p>
        </div>

        <div class="options-grid">
            <div class="option-card" data-texture="smooth">
                <div class="texture-preview texture-smooth"></div>
                <div class="option-label">Smooth</div>
            </div>
            <div class="option-card" data-texture="rough">
                <div class="texture-preview texture-rough"></div>
                <div class="option-label">Rough / Dry</div>
            </div>
            <div class="option-card" data-texture="dotted">
                <div class="texture-preview texture-dotted"></div>
                <div class="option-label">Dotted</div>
            </div>
        </div>

        <div class="step-navigation">
            <button class="btn btn-back" id="btnBack">Back</button>
        </div>
    </div>

    <script>
        // Check if user has completed previous steps
        const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
        if (!brushSettings || !brushSettings.color || !brushSettings.shape) {
            // Redirect back to step 1 if previous steps not completed
            window.location.href = 'step1.html';
        }

        // Handle option card clicks
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', function() {
                const texture = this.dataset.texture;

                // Remove selected class from all cards
                document.querySelectorAll('.option-card').forEach(c => {
                    c.classList.remove('selected');
                });

                // Add selected class to clicked card
                this.classList.add('selected');

                // Store texture selection in localStorage
                const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
                brushSettings.texture = texture;
                localStorage.setItem('brushSettings', JSON.stringify(brushSettings));

                // Navigate to canvas after a brief delay
                setTimeout(() => {
                    window.location.href = 'canvas.html';
                }, 400);
            });
        });

        // Restore previous selection if coming back from canvas
        if (brushSettings.texture) {
            document.querySelectorAll('.option-card').forEach(card => {
                if (card.dataset.texture === brushSettings.texture) {
                    card.classList.add('selected');
                }
            });
        }

        // Back button handler
        document.getElementById('btnBack').addEventListener('click', () => {
            window.location.href = 'step2.html';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 3: Choose Texture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .step-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e0e0e0;
        }

        .step-dot.active {
            background: #000;
        }

        .step-title {
            font-size: 24px;
            color: #000;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .step-description {
            color: #666;
            font-size: 14px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 0 0 40px 0;
        }

        .option-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .option-card:hover {
            border-color: #000;
        }

        .option-card.selected {
            border-color: #000;
            border-width: 2px;
            padding: 23px 15px;
        }

        .texture-preview {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .texture-smooth {
            background: #000;
        }

        .texture-rough {
            background: repeating-linear-gradient(
                45deg,
                #000,
                #000 3px,
                #666 3px,
                #666 6px
            );
        }

        .texture-dotted {
            background: radial-gradient(circle, #000 1.5px, transparent 1.5px);
            background-size: 10px 10px;
            background-color: #fff;
        }

        .option-label {
            font-size: 14px;
            font-weight: 500;
            color: #000;
        }

        .step-navigation {
            display: flex;
            justify-content: flex-start;
        }

        .btn {
            padding: 10px 24px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .btn-back {
            color: #000;
        }

        .btn-back:hover {
            border-color: #000;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .step-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="step-header">
            <div class="step-indicator">
                <div class="step-dot"></div>
                <div class="step-dot"></div>
                <div class="step-dot active"></div>
            </div>
            <h1 class="step-title">Choose your brush texture</h1>
            <p class="step-description">Select how your brush strokes will appear</p>
        </div>

        <div class="options-grid">
            <div class="option-card" data-texture="smooth">
                <div class="texture-preview texture-smooth"></div>
                <div class="option-label">Smooth</div>
            </div>
            <div class="option-card" data-texture="rough">
                <div class="texture-preview texture-rough"></div>
                <div class="option-label">Rough / Dry</div>
            </div>
            <div class="option-card" data-texture="dotted">
                <div class="texture-preview texture-dotted"></div>
                <div class="option-label">Dotted</div>
            </div>
        </div>

        <div class="step-navigation">
            <button class="btn btn-back" id="btnBack">← Back</button>
        </div>
    </div>

    <script>
        // Check if user has completed previous steps
        const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
        if (!brushSettings || !brushSettings.color || !brushSettings.shape) {
            // Redirect back to step 1 if previous steps not completed
            window.location.href = 'step1.html';
        }

        // Handle option card clicks
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', function() {
                const texture = this.dataset.texture;

                // Remove selected class from all cards
                document.querySelectorAll('.option-card').forEach(c => {
                    c.classList.remove('selected');
                });

                // Add selected class to clicked card
                this.classList.add('selected');

                // Store texture selection in localStorage
                const brushSettings = JSON.parse(localStorage.getItem('brushSettings'));
                brushSettings.texture = texture;
                localStorage.setItem('brushSettings', JSON.stringify(brushSettings));

                // Navigate to canvas after a brief delay
                setTimeout(() => {
                    window.location.href = 'canvas.html';
                }, 300);
            });
        });

        // Restore previous selection if coming back from canvas
        if (brushSettings.texture) {
            document.querySelectorAll('.option-card').forEach(card => {
                if (card.dataset.texture === brushSettings.texture) {
                    card.classList.add('selected');
                }
            });
        }

        // Back button handler
        document.getElementById('btnBack').addEventListener('click', () => {
            window.location.href = 'step2.html';
        });
    </script>
</body>
</html>

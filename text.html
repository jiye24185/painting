<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Text to Your Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .page-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back-arrow {
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s ease;
            margin-right: 16px;
        }

        .btn-back-arrow:hover {
            border-color: #000;
        }

        .text-header {
            text-align: center;
            flex: 1;
        }

        .text-title {
            font-size: 24px;
            color: #000;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .text-description {
            color: #666;
            font-size: 14px;
        }

        /* Canvas Container */
        .canvas-wrapper {
            position: relative;
            display: inline-block;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }

        #displayCanvas {
            display: block;
            border: 1px solid #e0e0e0;
            max-width: 100%;
            cursor: text;
        }

        /* Canvas shape clip paths */
        #displayCanvas.shape-square {
            clip-path: none;
        }

        #displayCanvas.shape-circle {
            clip-path: circle(50%);
        }

        #displayCanvas.shape-star {
            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 57%,
                79% 91%,
                50% 70%,
                21% 91%,
                32% 57%,
                2% 35%,
                39% 35%
            );
        }

        #displayCanvas.shape-heart {
            clip-path: path('M 250,100 C 200,50 100,50 100,150 C 100,250 250,350 250,350 C 250,350 400,250 400,150 C 400,50 300,50 250,100');
            width: 500px;
            height: 450px;
        }

        /* Text Input Controls */
        .text-controls {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 16px;
            margin: 16px 0;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #000;
            margin-bottom: 8px;
        }

        .text-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .text-input:focus {
            outline: none;
            border-color: #000;
        }

        .control-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .control-item {
            flex: 1;
            min-width: 150px;
        }

        .font-size-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
        }

        .color-input {
            width: 100%;
            height: 40px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Action Buttons */
        .action-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .btn:hover {
            border-color: #000;
        }

        .btn-primary {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .btn-primary:hover {
            background: #333;
        }

        @media (max-width: 600px) {
            .text-title {
                font-size: 20px;
            }

            #displayCanvas {
                width: 100% !important;
                height: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <button class="btn-back-arrow" id="btnBackArrow">← Back</button>
            <div class="text-header">
                <h2 class="text-title">Add text to your card</h2>
                <p class="text-description">Type to see text on canvas • Click canvas to reposition</p>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="displayCanvas" width="500" height="500"></canvas>
        </div>

        <!-- Text Input Controls -->
        <div class="text-controls">
            <div class="control-group">
                <label class="control-label">Text</label>
                <input type="text" class="text-input" id="textInput" placeholder="Enter your text here...">
            </div>
            <div class="control-row">
                <div class="control-item">
                    <label class="control-label">Font Size</label>
                    <input type="number" class="font-size-input" id="fontSizeInput" value="30" min="10" max="100">
                </div>
                <div class="control-item">
                    <label class="control-label">Text Color</label>
                    <input type="color" class="color-input" id="textColorInput" value="#000000">
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-controls">
            <button class="btn" id="btnClear">Clear Text</button>
            <button class="btn btn-primary" id="btnSave">Save Card</button>
            <button class="btn" id="btnRestart">Restart</button>
        </div>
    </div>

    <script>
        // ============================================
        // LOAD SETTINGS AND DRAWING FROM LOCALSTORAGE
        // ============================================
        const settings = JSON.parse(localStorage.getItem('brushSettings'));
        const canvasData = localStorage.getItem('canvasDrawing');

        // Redirect to step 1 if settings are incomplete
        if (!settings || !settings.canvasShape || !settings.paperTexture || !canvasData) {
            window.location.href = 'step1.html';
        }

        // ============================================
        // CANVAS SETUP
        // ============================================
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');

        // Apply canvas shape clip-path
        canvas.classList.add('shape-' + settings.canvasShape);

        // Set canvas background texture
        const textureMap = {
            'Texturelabs_Paper_150S.jpg': 'linear-gradient(135deg, #D4A574 0%, #C89968 50%, #B8865F 100%)',
            'Texturelabs_Paper_237S.jpg': 'linear-gradient(135deg, #FFFFFF 0%, #F8F8F8 50%, #F0F0F0 100%)',
            'Texturelabs_Paper_300S.jpg': 'linear-gradient(0deg, transparent 24%, rgba(0, 0, 0, .05) 25%, rgba(0, 0, 0, .05) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, .05) 75%, rgba(0, 0, 0, .05) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(0, 0, 0, .05) 25%, rgba(0, 0, 0, .05) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, .05) 75%, rgba(0, 0, 0, .05) 76%, transparent 77%, transparent)'
        };

        canvas.style.background = textureMap[settings.paperTexture] || '#FFFFFF';
        if (settings.paperTexture === 'Texturelabs_Paper_300S.jpg') {
            canvas.style.backgroundSize = '25px 25px';
            canvas.style.backgroundColor = '#F5F5F5';
        }

        // Load the drawing from localStorage
        const img = new Image();
        img.onload = function() {
            ctx.drawImage(img, 0, 0);
        };
        img.src = canvasData;

        // Store current text settings
        let textSettings = {
            text: '',
            fontSize: 30,
            color: '#000000',
            x: canvas.width / 2,
            y: canvas.height / 2
        };

        // Function to redraw canvas with text
        function redrawCanvas() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Reload the original drawing
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0);

                // Draw text if exists
                if (textSettings.text) {
                    ctx.font = `${textSettings.fontSize}px Arial`;
                    ctx.fillStyle = textSettings.color;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(textSettings.text, textSettings.x, textSettings.y);
                }
            };
            img.src = canvasData;
        }

        // ============================================
        // TEXT INPUT FUNCTIONALITY
        // ============================================
        const textInput = document.getElementById('textInput');
        const fontSizeInput = document.getElementById('fontSizeInput');
        const textColorInput = document.getElementById('textColorInput');

        // Update text as user types
        textInput.addEventListener('input', function() {
            textSettings.text = this.value;
            textSettings.fontSize = parseInt(fontSizeInput.value);
            textSettings.color = textColorInput.value;
            redrawCanvas();
        });

        // Update text when font size changes
        fontSizeInput.addEventListener('input', function() {
            textSettings.fontSize = parseInt(this.value);
            if (textSettings.text) {
                redrawCanvas();
            }
        });

        // Update text when color changes
        textColorInput.addEventListener('input', function() {
            textSettings.color = this.value;
            if (textSettings.text) {
                redrawCanvas();
            }
        });

        // ============================================
        // CANVAS CLICK TO REPOSITION TEXT
        // ============================================
        canvas.addEventListener('click', function(e) {
            if (!textSettings.text) {
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Update text position
            textSettings.x = x;
            textSettings.y = y;
            redrawCanvas();
        });

        // ============================================
        // ACTION BUTTONS
        // ============================================
        document.getElementById('btnBackArrow').addEventListener('click', () => {
            window.location.href = 'canvas.html';
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            if (confirm('Clear text from the canvas?')) {
                // Clear text settings and input
                textSettings.text = '';
                textInput.value = '';

                // Reload the original drawing
                redrawCanvas();
            }
        });

        document.getElementById('btnSave').addEventListener('click', () => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            // Apply texture background
            const textureColors = {
                'Texturelabs_Paper_150S.jpg': '#C89968',
                'Texturelabs_Paper_237S.jpg': '#F8F8F8',
                'Texturelabs_Paper_300S.jpg': '#F5F5F5'
            };
            tempCtx.fillStyle = textureColors[settings.paperTexture] || '#FFFFFF';
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

            // Draw the actual canvas content
            tempCtx.drawImage(canvas, 0, 0);

            // Download
            tempCanvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
                link.download = `my-card-${timestamp}.png`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            });
        });

        document.getElementById('btnRestart').addEventListener('click', () => {
            if (confirm('This will clear your current work and start over. Are you sure?')) {
                localStorage.removeItem('brushSettings');
                localStorage.removeItem('canvasDrawing');
                window.location.href = 'step1.html';
            }
        });
    </script>
</body>
</html>
